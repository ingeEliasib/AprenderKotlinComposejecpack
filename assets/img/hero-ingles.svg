<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Ilustración: burbuja de diálogo en inglés con ondas de sonido y microphone">
  <title>Inglés para entrevistas: la frase escrita y su pronunciación</title>
  <defs>
    <linearGradient id="iBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5fbf" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0b4551" stop-opacity=".06"/>
    </linearGradient>
  </defs>

  <rect x="10" y="14" width="400" height="272" rx="18" fill="url(#iBg)"/>

  <!-- burbuja de diálogo -->
  <rect x="46" y="40" width="240" height="104" rx="18" fill="#ffffff" stroke="#2f5fbf" stroke-width="3"/>
  <path d="M86 144 L80 168 L108 144 Z" fill="#ffffff" stroke="#2f5fbf" stroke-width="3" stroke-linejoin="round"/>
  <rect x="70" y="66" width="170" height="9" rx="4.5" fill="#2f5fbf" opacity=".55"/>
  <rect x="70" y="86" width="192" height="9" rx="4.5" fill="#2f5fbf" opacity=".35"/>
  <rect x="70" y="106" width="118" height="9" rx="4.5" fill="#2f5fbf" opacity=".35"/>
  <text x="70" y="134" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#56626e">"Tell me about yourself."</text>

  <!-- ondas de sonido -->
  <g stroke="#2f5fbf" stroke-width="3" stroke-linecap="round" opacity=".8">
    <path d="M302 70 q10 14 0 28"/>
    <path d="M316 60 q18 24 0 48"/>
    <path d="M330 50 q26 34 0 68"/>
  </g>

  <!-- micrófono -->
  <g>
    <rect x="296" y="152" width="34" height="58" rx="17" fill="#2f5fbf"/>
    <rect x="305" y="160" width="16" height="34" rx="8" fill="#ffffff" opacity=".85"/>
    <path d="M288 192 a 25 25 0 0 0 50 0" fill="none" stroke="#0b4551" stroke-width="4" stroke-linecap="round"/>
    <path d="M313 217 L313 232" stroke="#0b4551" stroke-width="4" stroke-linecap="round"/>
    <path d="M298 233 L328 233" stroke="#0b4551" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- ficha de pronunciación -->
  <g>
    <rect x="46" y="178" width="212" height="76" rx="12" fill="#ffffff" stroke="#cfd8d3" stroke-width="2"/>
    <text x="62" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#56626e">PRONUNCIACIÓN (IPA)</text>
    <text x="62" y="222" font-family="Georgia, serif" font-size="15" fill="#0b4551">/tɛl mi əˈbaʊt jɔːrˈsɛlf/</text>
    <text x="62" y="242" font-family="system-ui, sans-serif" font-size="10" fill="#56626e">guía en español: "tel mi a-báut yórself"</text>
  </g>

  <!-- nota de método -->
  <g>
    <rect x="272" y="252" width="120" height="30" rx="10" fill="#0b4551"/>
    <text x="332" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">STAR · 3-5 historias</text>
  </g>
</svg>
